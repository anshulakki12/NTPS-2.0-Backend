<mat-dialog-content class="dialog-content">
  <h1 class="dialog-title">{{ data.title }}</h1>
  <mat-divider></mat-divider>

  <ol class="instruction-list">
    <li *ngFor="let instruction of data.instructions" [innerHTML]="instruction"></li>
  </ol>
</mat-dialog-content>

<mat-dialog-actions align="center">
  <button mat-raised-button color="primary" (click)="closeDialog()">Got it</button>
</mat-dialog-actions>
