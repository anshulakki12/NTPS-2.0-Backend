<!-- Back Button -->
<button mat-stroked-button class="back-button" (click)="goBack()">
  <mat-icon>arrow_back</mat-icon> Back
</button>
<div class="container">
  <!-- Instructions Column -->
  <div class="instructions-card">
    <h3>Instructions</h3>
    <mat-divider></mat-divider>
    <ol class="instruction-list">
      <li>Enter the valid Login ID.</li>
      <li>Enter Captcha.</li>
      <li>OTP will be sent on your registered mobile.</li>
      <li>Set new password. You can login after setting the Password.</li>
    </ol>
  </div>

  <!-- Login Form -->
  <mat-card class="login-box">
    <h2 class="form-heading">Forgot Password</h2>

    <form [formGroup]="regenForm" (ngSubmit)="onSubmit()">

      <!-- Login ID -->
      <mat-form-field appearance="fill" class="form-field full-width">
        <mat-label>Login ID</mat-label>
        <input matInput formControlName="loginId" placeholder="Enter Login ID" />
        <mat-error *ngIf="regenForm.get('loginId')?.invalid && regenForm.get('loginId')?.touched">
          Login ID is required
        </mat-error>
      </mat-form-field>

      <!-- Captcha -->
      <div class="form-row">
        <div class="captcha-box">
          <label class="captcha-label">Captcha</label>
          <div class="captcha-img">{{ captcha }}</div>
          <button mat-icon-button type="button" (click)="refreshCaptcha()" aria-label="Refresh Captcha">
            <mat-icon>refresh</mat-icon>
          </button>
        </div>

        <mat-form-field appearance="fill" class="form-field full-width">
          <mat-label>Enter Captcha</mat-label>
          <input matInput formControlName="captchaInput" placeholder="Enter Captcha" />
          <mat-error *ngIf="regenForm.get('captchaInput')?.invalid && regenForm.get('captchaInput')?.touched">
            Captcha is required
          </mat-error>
        </mat-form-field>
      </div>

      <!-- Submit -->
      <div class="action-row">
        <button mat-raised-button color="primary" type="submit">Submit</button>
      </div>
    </form>
  </mat-card>

</div>
