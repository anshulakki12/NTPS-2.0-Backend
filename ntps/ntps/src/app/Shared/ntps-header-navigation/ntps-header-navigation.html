<!-- Modern Govt Website Header -->
<!-- Top Bar -->
<!-- Fixed Header Section -->
<div class="topbar">
  <div class="topbar-left">
    <img src="assets/images/flag.png" alt="flag Logo" class="flag-icon" />
    <span class="flag-icon">भारत सरकार | Government of India</span>
  </div>
  <div class="font-size-controls">
    <button (click)="changeFontSize('small')">A-</button>
    <button (click)="changeFontSize('normal')">A</button>
    <button (click)="changeFontSize('large')">A+</button>
  </div>
  <select (change)="translateSite($event)">
    <option value="">Select Language</option>
    <option value="en">English</option>
    <option value="hi">Hindi</option>
    <option value="ta">Tamil</option>
    <option value="bn">Bengali</option>
  </select>
</div>

<header class="govt-header">
  <div class="left-logo">
    <img src="assets/images/logoTimber.png" alt="India Emblem" />
  </div>
  <div class="header-text">
    <h1>National Transit Pass System</h1>
    <h2>Towards Sustainable Forestry</h2>
  </div>
  <div class="right-logos">
    <img src="assets/images/g-logo.png" alt="G20 Logo" />
    <img src="assets/images/life.png" alt="LiFE Logo" />
    <img src="assets/images/azadi.png" alt="Azadi Logo" />
    <img src="assets/images/ntps-logo.png" alt="NTPS Logo" />
  </div>
</header>

<div class="gradient-strip"></div>
